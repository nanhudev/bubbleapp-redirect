<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="月薪 12,000 元的实时工资进度，按北京时间 10:30–18:00 测算。">
  <meta name="theme-color" content="#f2f6fb">
  <title>实时工资 · 月薪 ¥12,000</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f2f6fb; color: #162437; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 20px; background: radial-gradient(ellipse at 50% 0, #e1eefb, #f2f6fb 62%); }
    main { width: min(100%, 460px); background: #ffffff; border: 1px solid #d5e0ec; border-radius: 24px; padding: clamp(20px, 5vw, 30px); box-shadow: 0 18px 48px #203b591a; }
    header, .shift { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    h1 { font-size: 19px; margin: 0; }
    .monthly { color: #12654f; font-size: 14px; font-weight: 650; }
    .hero { margin: 24px 0; background: #eef6f4; border-radius: 16px; padding: 20px 16px; }
    .label, .shift, footer { color: #465b71; font-size: 13px; }
    .amount { display: block; font-size: clamp(34px, 9vw, 54px); font-weight: 720; letter-spacing: -0.045em; line-height: 1.18; margin-block: 6px 10px; }
    .amount, dd { font-variant-numeric: tabular-nums; }
    .status { color: #12654f; font-size: 13px; font-weight: 650; }
    progress { display: block; width: 100%; height: 8px; appearance: none; border: 0; background: #dce8e6; border-radius: 999px; overflow: hidden; }
    progress::-webkit-progress-bar { background: #dce8e6; }
    progress::-webkit-progress-value { background: #218365; }
    progress::-moz-progress-bar { background: #218365; }
    .shift { margin-top: 8px; }
    dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 24px 0 20px; }
    dt { color: #465b71; font-size: 12px; }
    dd { margin: 5px 0 0; font-size: clamp(13px, 3.5vw, 17px); font-weight: 650; }
    footer { border-top: 1px solid #d5e0ec; padding-top: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <header><h1>实时工资</h1><span class="monthly">月薪 ¥12,000</span></header>
    <section class="hero" aria-labelledby="today-label">
      <div id="today-label" class="label">今日已赚</div>
      <span class="amount" id="today">¥0.000</span>
      <div class="status" id="status"></div>
    </section>
    <progress id="progress" max="1" value="0" aria-label="今日收入进度"></progress>
    <div class="shift"><span>10:30 上班</span><span>18:00 下班</span></div>
    <dl>
      <div><dt>本月累计</dt><dd id="month-total"></dd></div>
      <div><dt>每日折算</dt><dd id="daily"></dd></div>
      <div><dt>每小时</dt><dd id="hourly"></dd></div>
    </dl>
    <footer>北京时间 · <span id="workdays"></span>，按周一至周五均摊。午休计入工时，节假日和调休按普通星期计算。</footer>
    <noscript>开启 JavaScript 即可查看实时金额。</noscript>
  </main>
  <script type="module">
    import { calculateWage } from './wage.js';

    const ids = ['today', 'status', 'progress', 'month-total', 'daily', 'hourly', 'workdays'];
    const fields = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
    const currency = digits => new Intl.NumberFormat('zh-CN', {
      style: 'currency', currency: 'CNY', minimumFractionDigits: digits, maximumFractionDigits: digits,
    });
    const precise = currency(3);
    const standard = currency(2);

    function update() {
      const wage = calculateWage(new Date());
      const amount = precise.format(wage.earnedToday);
      const values = {
        today: amount,
        status: wage.status,
        'month-total': standard.format(wage.earnedThisMonth),
        daily: standard.format(wage.daily),
        hourly: standard.format(wage.hourly),
        workdays: `${wage.month} 月有 ${wage.workdays} 个工作日`,
      };
      for (const [id, value] of Object.entries(values)) {
        if (fields[id].textContent !== value) fields[id].textContent = value;
      }
      fields.progress.value = wage.fraction;
      const title = `${amount} · 今日已赚`;
      if (document.title !== title) document.title = title;
    }

    update();
    setInterval(update, 100);
  </script>
</body>
</html>
